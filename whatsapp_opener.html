<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Chat Launcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #f0f2f5;
      font-family: 'Roboto', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .container h2 {
      margin-bottom: 20px;
      color: #075e54;
    }
    .container input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    .container button {
      width: 100%;
      padding: 15px;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .container button:hover {
      background: #128C7E;
    }
    .error {
      color: red;
      font-size: 14px;
      margin-top: -10px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Open WhatsApp Chat</h2>
    <input type="text" id="phoneInput" placeholder="Enter full phone number with country code">
    <div id="errorMsg" class="error"></div>
    <button onclick="openWhatsApp()">Open in WhatsApp</button>
  </div>

  <script>
    function openWhatsApp() {
      var phoneInput = document.getElementById("phoneInput");
      var phoneNumber = phoneInput.value.trim();
      var errorMsg = document.getElementById("errorMsg");

      if (phoneNumber === "") {
        errorMsg.textContent = "Please enter the phone number with country code";
        return;
      }

      // Remove spaces
      phoneNumber = phoneNumber.replace(/\s+/g, '');

      // Ensure it starts with "+" or digits
      if (!phoneNumber.startsWith("+") && !/^\d+$/.test(phoneNumber)) {
        errorMsg.textContent = "Phone number must start with '+' and country code, e.g. +88017XXXXXXX";
        return;
      }

      errorMsg.textContent = "";

      var url = "https://api.whatsapp.com/send?phone=" + encodeURIComponent(phoneNumber);
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
